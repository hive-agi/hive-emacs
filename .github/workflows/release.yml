name: release

# Publishes the exact VERSION reviewed in the merged PR — release CI does not
# bump. Deploy runs BEFORE tagging, so a tag records a publish that happened.
# CI never pushes a branch: main is protected, and `git push --follow-tags`
# sends branch and tag together, landing the tag even when the branch is
# rejected.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: '1.12.5.1664'

      - name: Resolve VERSION and skip if already tagged
        id: ver
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "Tag v$VER already exists - nothing to publish."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      # A published artifact may depend only on published artifacts. Resolve
      # with ONLY the public registries and cold caches. All three isolations
      # are required: CLJ_CONFIG relocates the user-level ~/.clojure/deps.edn
      # that declares the private registry, and :mvn/local-repo forces a real
      # fetch — a warm ~/.m2 already holds privately-sourced jars and would
      # satisfy the resolve without ever hitting the network.
      - name: Guard - tree must resolve from public registries only
        if: steps.ver.outputs.fresh == 'true'
        run: |
          CLJ_CONFIG=$(mktemp -d); export CLJ_CONFIG
          GITLIBS=$(mktemp -d);    export GITLIBS
          M2=$(mktemp -d)
          {
            echo "{:mvn/local-repo \"$M2\""
            echo ' :mvn/repos {"central" {:url "https://repo1.maven.org/maven2/"}'
            echo '             "clojars" {:url "https://repo.clojars.org/"}}}'
          } > "$CLJ_CONFIG/deps.edn"
          clojure -Sforce -P

      - name: Deploy
        if: steps.ver.outputs.fresh == 'true'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy

      - name: Tag the published version
        if: steps.ver.outputs.fresh == 'true'
        run: |
          VER=${{ steps.ver.outputs.ver }}
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git tag -a "v$VER" -m "release $VER"
          git push origin "refs/tags/v$VER"
