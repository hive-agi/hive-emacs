name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clojure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hive-emacs
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
          # Pinned: a kondo release can add findings to an unchanged tree and
          # gate merges. Bump deliberately, after linting locally at the new
          # version with the dependency pass (a cold local lint is a false green).
          clj-kondo: '2026.10.26'

      # Caches the resolved dependency tree across runs, keyed on the files
      # that declare it.
      - name: Cache Maven and gitlibs
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # The macro configs kondo needs live in the dependency jars, and
      # .clj-kondo/imports/ is gitignored, so a fresh checkout has none of
      # them: every hive-dsl / ansatz / typed macro form reads as an
      # unresolved symbol. Import them before linting anything.
      - name: Import dependency lint configs
        run: >-
          clj-kondo --lint "$(clojure -Spath -M:test:typed:ansatz-test)"
          --dependencies --parallel --copy-configs

      - name: Run static analysis
        run: clj-kondo --lint src test src-typed test-ansatz

      - name: Run Clojure and Malli verification
        run: clojure -M:test

      - name: Run Typed Clojure verification
        run: >-
          clojure -M:typed -e
          "(require 'typed.clojure 'hive-emacs.typed-scoring)
          (typed.clojure/check-ns-clj 'hive-emacs.typed-scoring)"

      - name: Run Ansatz kernel proofs
        run: clojure -M:ansatz-test

  cljel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hive-emacs
        uses: actions/checkout@v7

      - name: Read the pinned clojure-elisp compiler
        id: clel
        run: |
          echo "sha=$(bash scripts/clel-pin.sh sha)" >> "$GITHUB_OUTPUT"
          echo "clojure-elisp $(bash scripts/clel-pin.sh version)"

      - name: Checkout clojure-elisp
        uses: actions/checkout@v7
        with:
          repository: BuddhiLW/clojure-elisp
          ref: ${{ steps.clel.outputs.sha }}
          path: .cache/clojure-elisp

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
          bb: 1.13.230

      - name: Cache Maven and gitlibs
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Check the build publishes nothing on failure
        run: bb test:build

      # Recompile every .cljel source; the ERT suites then load what this run
      # built, never whatever .el happened to be committed.
      - name: Compile .cljel sources to Elisp
        env:
          CLEL_HOME: ${{ github.workspace }}/.cache/clojure-elisp
        run: bb build

      - name: Check committed .el match the pinned compiler's output
        run: git diff --exit-code -- elisp src/cljel

      - name: Check ERT artifacts define nothing outside their own prefix
        run: bb lint:ert-defs

      - name: Run addon ERT suites
        run: bb test:ert
